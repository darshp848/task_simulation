# Station config written by `dreamcli setup`. `dreamcli robot up` runs the station agent on it.
# Every key is documented in the robots README, *Config file*; the loop keys not written here keep the
# package's defaults. Re-run `dreamcli setup` to change it, or edit it by hand.

body: metal
follower_l:
  can_channel: can_follower_l
  gripper_hold_torque_nm: 1.5  # was 0.5 (backup: station.yaml.bak-before-holdtorque)
  gripper_closed_deg: 0.0
  gripper_open_deg: 111.0
  home: [0.1436, 0.0018, 0.0091, -0.0256, 0.2147, -0.03]
follower_r:
  can_channel: can_follower_r
  gripper_hold_torque_nm: 1.5  # was 0.5 (backup: station.yaml.bak-before-holdtorque)
  gripper_closed_deg: 0.0
  gripper_open_deg: 113.8
  home: [0.008, 0.0005, -0.0419, 0.1758, -0.003, -0.0792]
cameras:
- {name: scene, device: '/dev/v4l/by-path/pci-0000:65:00.3-usb-0:2:1.0-video-index0',
  width: 1280, height: 720, fps: 30, rotate: 0}
- {name: wrist_l, device: '/dev/v4l/by-path/pci-0000:67:00.3-usb-0:1.3:1.0-video-index0',
  width: 1280, height: 720, fps: 30, rotate: 0}
- {name: wrist_r, device: '/dev/v4l/by-path/pci-0000:67:00.3-usb-0:1.4:1.0-video-index0',
  width: 1280, height: 720, fps: 30, rotate: 0}
action_horizon: 48
stale_after_s: 0.2
max_stall_ticks: 240
max_ee_speed_m_s: 0.6
face_blur: true
live: {robot_id: REDACTED}
